x-gpu-deploy: &gpu-deploy
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-common-environment: &common-env
  LOG_LEVEL: "INFO"
  NVIDIA_VISIBLE_DEVICES: "all"
  CUDA_DEVICE_ORDER: "PCI_BUS_ID"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "/workspace"
  LD_LIBRARY_PATH: "/home/ray/anaconda3/lib:/home/ray/anaconda3/lib/python3.10/site-packages/torch/lib:/usr/local/cuda/lib64"
services:
  # =========================================================================
  # 1. Ray Head Node (Cluster Control Plane + GPU Worker 0)
  # =========================================================================
  ray-head:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nexuscache-ray-head
    hostname: ray-head
    ipc: host
    shm_size: "16gb"
    command: >
      ray start --head 
                --port=6379 
                --dashboard-host=0.0.0.0 
                --dashboard-port=8265 
                --num-gpus=1 
                --block
    environment:
      <<: *common-env
      RAY_GRAFANA_IFRAME_HOST: "http://localhost:3000"
    ports:
      - "6379:6379"   # Ray Redis / GCS Port
      - "8265:8265"   # Ray Dashboard UI
      - "10001:10001" # Ray Client Port
    volumes:
      - ..:/workspace  # <--- Fix 2: Mount complete workspace so source code exists
    <<: *gpu-deploy
    healthcheck:
      test: ["CMD", "ray", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. Ray Worker Node (Scaling Compute / GPU Workers 1+)
  # =========================================================================
  ray-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nexuscache-ray-worker
    hostname: ray-worker
    ipc: host
    shm_size: "16gb"
    command: >
      ray start --address=ray-head:6379 
                --num-gpus=1 
                --block
    environment:
      <<: *common-env
    depends_on:
      ray-head:
        condition: service_healthy
    volumes:
      - ..:/workspace
    <<: *gpu-deploy
    restart: on-failure

  # =========================================================================
  # 3. Serving API Engine (FastAPI / Scheduler Front-End)
  # =========================================================================
  serving-engine:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nexuscache-serving-engine
    hostname: serving-engine
    command: python3 -m nexuscache.server.api_server --config /workspace/config/engine.yaml
    environment:
      <<: *common-env
      RAY_ADDRESS: "ray://ray-head:10001"
      NEXUSCACHE_SERVER_HOST: "0.0.0.0"
      NEXUSCACHE_SERVER_PORT: "8000"
    ports:
      - "8000:8000"   # REST / Streaming API Endpoint
      - "9090:9090"   # Prometheus Telemetry Metrics Endpoint
    depends_on:
      ray-head:
        condition: service_healthy
    volumes:
      - ..:/workspace  # <--- Fix 2: Mount workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # =========================================================================
  # 4. Load Generator & Benchmark Suite
  # =========================================================================
  benchmark-loadgen:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nexuscache-loadgen
    profiles: ["benchmark"]
    command: >
      python3 -m nexuscache.benchmark.bench_runner 
              --host http://serving-engine:8000 
              --dataset-path /workspace/data/ShareGPT_V3_unfiltered_cleaned_split.json 
              --concurrency-levels 1 8 32 64 128 256 
              --output-dir /workspace/benchmark_results
    environment:
      <<: *common-env
    depends_on:
      serving-engine:
        condition: service_healthy
    volumes:
      - ..:/workspace